name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    # Pull requests from forks are not built, so third-party code never runs
    # on our runners or touches the build cache. PRs from branches of this
    # repository, which only collaborators can push to, still are.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0 # git describe needs the tags
          # Nothing here pushes; do not leave the token in .git/config.
          persist-credentials: false

      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds, runs the tests and packages, all inside docker/release.Dockerfile.
      # Values go through env rather than ${{ }} in the script, so they can
      # never be read as shell syntax.
      - name: Build, test and package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          docker buildx build -f docker/release.Dockerfile
          --platform "linux/$ARCH"
          --build-arg "VERSION=$VERSION"
          --cache-from "type=gha,scope=$ARCH"
          --cache-to "type=gha,mode=max,scope=$ARCH"
          --output type=local,dest=dist .

      # The binary was built against musl; make sure it also runs on the
      # glibc-based runner without any shared library.
      - name: Check the binary is static
        if: matrix.arch == 'amd64'
        run: |
          tar -xzf dist/php-ebpf-tracer-*.tar.gz -C "$RUNNER_TEMP"
          bin=$(echo "$RUNNER_TEMP"/php-ebpf-tracer-*/php-ebpf-tracer)
          file "$bin"
          if ldd "$bin"; then echo "dynamically linked" >&2; exit 1; fi
          "$bin" -version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Signing and storing the build provenance attestation.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz sources/* | tee SHA256SUMS

      # Build provenance for the archive, so users can check it was built by
      # this workflow: gh attestation verify <file> --repo <owner>/<repo>.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/*.tar.gz dist/sources/* dist/SHA256SUMS
