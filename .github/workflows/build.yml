name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # git describe needs the tags

      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Builds, runs the tests and packages, all inside docker/release.Dockerfile.
      - name: Build, test and package
        run: >-
          docker buildx build -f docker/release.Dockerfile
          --platform linux/${{ matrix.arch }}
          --build-arg VERSION=${{ steps.version.outputs.version }}
          --cache-from type=gha,scope=${{ matrix.arch }}
          --cache-to type=gha,mode=max,scope=${{ matrix.arch }}
          --output type=local,dest=dist .

      # The binary was built against musl; make sure it also runs on the
      # glibc-based runner without any shared library.
      - name: Check the binary is static
        if: matrix.arch == 'amd64'
        run: |
          tar -xzf dist/php-ebpf-tracer-*.tar.gz -C "$RUNNER_TEMP"
          bin=$(echo "$RUNNER_TEMP"/php-ebpf-tracer-*/php-ebpf-tracer)
          file "$bin"
          if ldd "$bin"; then echo "dynamically linked" >&2; exit 1; fi
          "$bin" -version

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz sources/* | tee SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/*.tar.gz dist/sources/* dist/SHA256SUMS
