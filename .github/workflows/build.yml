name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    # Pull requests from forks are not built, so third-party code never runs
    # on our runners or touches the build cache. PRs from branches of this
    # repository, which only collaborators can push to, still are.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          fetch-depth: 0 # git describe needs the tags
          # Nothing here pushes; do not leave the token in .git/config.
          persist-credentials: false

      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Builds, runs the tests and packages, all inside docker/release.Dockerfile.
      # Values go through env rather than ${{ }} in the script, so they can
      # never be read as shell syntax.
      - name: Build, test and package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          docker buildx build -f docker/release.Dockerfile
          --platform "linux/$ARCH"
          --build-arg "VERSION=$VERSION"
          --cache-from "type=gha,scope=$ARCH"
          --cache-to "type=gha,mode=max,scope=$ARCH"
          --output type=local,dest=dist .

      # The binary was built against musl; make sure it also runs on the
      # glibc-based runner without any shared library.
      - name: Check the binary is static
        if: matrix.arch == 'amd64'
        run: |
          tar -xzf dist/php-ebpf-tracer-*.tar.gz -C "$RUNNER_TEMP"
          bin=$(echo "$RUNNER_TEMP"/php-ebpf-tracer-*/php-ebpf-tracer)
          file "$bin"
          if ldd "$bin"; then echo "dynamically linked" >&2; exit 1; fi
          "$bin" -version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz sources/* | tee SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/*.tar.gz dist/sources/* dist/SHA256SUMS
